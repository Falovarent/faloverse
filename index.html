<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The District</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->

    <div class="background-word">
       <div class="word">

    <span class="letter" data-char="U">U</span>
    <span class="letter" data-char="N">N</span>
    <span class="letter" data-char="D">D</span>
    <span class="letter" data-char="E">E</span>
    <span class="letter" data-char="R">R</span>
    <span class="letter" data-char="G">G</span>
    <span class="letter" data-char="R">R</span>
    <span class="letter" data-char="O">O</span>
    <span class="letter" data-char="U">U</span>
    <span class="letter" data-char="N">N</span>
    <span class="letter" data-char="D">D</span>

</div>
    </div>


    <!-- RED CURSOR -->

    <div class="cursor"></div>


    <!-- INTRO -->

    <div id="intro">

        <div class="intro-content">

            <img src="logo.png" alt="The District">

            <div class="loading-line"></div>

        </div>

    </div>


    <!-- HOME -->

    <section class="page active" id="home">

        <div class="content">

            <h1>District</h1>

            <p class="tagline">
                NOTHING STAYS BURIED.
            </p>

            <button class="btn" data-page="comics">
                Enter The World
            </button>

        </div>

    </section>


    <!-- COMICS -->

    <section class="page" id="comics">

        <div class="content">

            <h2>Comics</h2>

            <div class="comic-card">

                <h3>Silent Kill</h3>

                <p class="comic-description">
                    A dark story of power, death, and chaos.
                </p>

                <p class="release">
                    CHAPTER 01 · COMING SOON
                </p>

                <button class="btn" data-page="book">
                    Read More
                </button>

            </div>

            <button class="text-button" data-page="home">
                Before
            </button>

        </div>

    </section>


    <!-- SILENT KILL -->

    <section class="page" id="book">

        <div class="content">

            <h2>Silent Kill</h2>

            <p class="description">
                ADD YOUR FULL DESCRIPTION HERE
            </p>

            <button class="btn" data-page="contact">
                Contact
            </button>

            <button class="text-button" data-page="comics">
                Before
            </button>

        </div>

    </section>


    <!-- CONTACT -->

    <section class="page" id="contact">

        <div class="content">

            <h2>Contact</h2>

            <div class="contact-links">

                <a href="mailto:faloverse@gmail.com">
                    faloverse@gmail.com
                </a>

                <a
                    href="https://instagram.com/faloverse.studio"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>

            </div>

            <button class="text-button" data-page="book">
                Before
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
