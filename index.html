
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Underground District</title>

    <link rel="icon"
          type="image/png"
          href="favicon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FIXED BACKGROUND -->
    <div class="background-word" aria-hidden="true">

        <div class="word">
            <span class="letter" data-char="U">U</span>
            <span class="letter" data-char="N">N</span>
            <span class="letter" data-char="D">D</span>
            <span class="letter" data-char="E">E</span>
            <span class="letter" data-char="R">R</span>
            <span class="letter" data-char="G">G</span>
            <span class="letter" data-char="R">R</span>
            <span class="letter" data-char="O">O</span>
            <span class="letter" data-char="U">U</span>
            <span class="letter" data-char="N">N</span>
            <span class="letter" data-char="D">D</span>
        </div>

    </div>


    <!-- CUSTOM CURSOR -->
    <div class="cursor"></div>


    <!-- LOADING SCREEN -->
    <div id="intro">

        <div class="intro-content">

            <img src="logo.png"
                 alt="Underground District logo">

            <div class="loading-line"></div>

        </div>

    </div>


    <!-- MAIN SCROLLING WEBSITE -->
    <main id="main-site">

        <!-- SCREEN 1: HOME -->
        <section class="page" id="home">

            <div class="content">

                <h1>District</h1>

                <p class="tagline">
                    NOTHING STAYS BURIED.
                </p>

                <button class="btn"
                        data-page="comics">
                    Enter The World
                </button>

            </div>

        </section>


        <!-- SCREEN 2: COMICS -->
        <section class="page" id="comics">

            <div class="content">

                <h2>Comics</h2>

                <div class="comic-card">

                    <h3>Silent Kill</h3>

                    <p class="comic-description">
                        A dark story of power,
                        death, and chaos.
                    </p>

                    <p class="release">
                        CHAPTER 01 · COMING SOON
                    </p>

                    <button class="btn"
                            id="read-more">
                        Read More
                    </button>

                </div>

                <button class="text-button"
                        data-page="home">
                    Before
                </button>

            </div>

        </section>


        <!-- SCREEN 3: CONTACT -->
        <section class="page" id="contact">

            <div class="content">

                <h2>Contact</h2>

                <div class="contact-links">

                    <a href="mailto:faloverse@gmail.com">
                        Email
                    </a>

                    <a href="https://instagram.com/faloverse.studio"
                       target="_blank"
                       rel="noopener noreferrer">
                        Instagram
                    </a>

                </div>

                <button class="text-button"
                        data-page="comics">
                    Before
                </button>

            </div>

        </section>

    </main>


    <!-- SEPARATE NON-SCROLLING COMIC VIEW -->
    <section class="comic-view"
             id="book"
             aria-hidden="true">

        <div class="content">

            <h2>Silent Kill</h2>

            <p class="description">
                ADD YOUR FULL DESCRIPTION HERE
            </p>

            <button class="btn"
                    id="close-book">
                Back to Comics
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
