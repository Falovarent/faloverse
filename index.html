
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Underground District</title>

    <link rel="icon"
          type="image/png"
          href="favicon.ico">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FIXED UNDERGROUND BACKGROUND -->
    <div class="background-word" aria-hidden="true">
        <div class="word">
            <span class="letter" data-char="U">U</span>
            <span class="letter" data-char="N">N</span>
            <span class="letter" data-char="D">D</span>
            <span class="letter" data-char="E">E</span>
            <span class="letter" data-char="R">R</span>
            <span class="letter" data-char="G">G</span>
            <span class="letter" data-char="R">R</span>
            <span class="letter" data-char="O">O</span>
            <span class="letter" data-char="U">U</span>
            <span class="letter" data-char="N">N</span>
            <span class="letter" data-char="D">D</span>
        </div>
    </div>


    <!-- PLAIN RED DOT CURSOR -->
    <div class="cursor"></div>


    <!-- LOADING SCREEN -->
    <div id="intro">
        <div class="intro-content">

            <img src="logo.png"
                 alt="Underground District logo">

            <div class="loading-line"></div>

        </div>
    </div>


    <!-- SCROLLING WEBSITE -->
    <main id="main-site">

        <!-- HOME -->
        <section class="page" id="home">
            <div class="content home-content">

                <h1>DISTRICT</h1>

                <p class="tagline">
                    NOTHING STAYS BURIED.
                </p>

                <button class="btn"
                        data-page="comics">
                    ENTER THE WORLD
                </button>

            </div>
        </section>


        <!-- COMICS -->
        <section class="page" id="comics">
            <div class="content">

                <h2>COMICS</h2>

                <div class="comic-card">

                    <h3>SILENT KILL</h3>

                    <p class="comic-description">
                        A dark story of power,
                        death and chaos.
                    </p>

                    <p class="release">
                        CHAPTER 01 · COMING SOON
                    </p>

                    <button class="btn" id="read-more">
                        READ MORE
                    </button>

                </div>

                <button class="text-button"
                        data-page="home">
                    BEFORE
                </button>

            </div>
        </section>


        <!-- CONTACT -->
        <section class="page" id="contact">
            <div class="content">

                <h2>CONTACT</h2>

                <div class="contact-links">

                    <a href="mailto:faloverse@gmail.com">
                        EMAIL
                    </a>

                    <a href="https://instagram.com/faloverse.studio"
                       target="_blank"
                       rel="noopener noreferrer">
                        INSTAGRAM
                    </a>

                </div>

                <button class="text-button"
                        data-page="comics">
                    BEFORE
                </button>

            </div>
        </section>

    </main>


    <!-- SEPARATE SILENT KILL VIEW -->
    <section id="book"
             class="comic-view"
             aria-hidden="true"
             inert>

        <div class="content book-content">

            <h2>SILENT KILL</h2>

            <button class="btn" id="close-book">
                BACK TO COMICS
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
