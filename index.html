<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The District</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         BACKGROUND WORD
    ====================================================== -->

    <div class="background-word" aria-hidden="true">

        <div class="word">

            <span class="letter">U</span>
            <span class="letter">N</span>
            <span class="letter">D</span>
            <span class="letter">E</span>
            <span class="letter">R</span>
            <span class="letter">G</span>
            <span class="letter">R</span>
            <span class="letter">O</span>
            <span class="letter">U</span>
            <span class="letter">N</span>
            <span class="letter">D</span>

        </div>

    </div>


    <!-- =====================================================
         RED CURSOR
    ====================================================== -->

    <div class="cursor"></div>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <div id="intro">

        <div class="intro-content">

            <img src="logo.png" alt="The District">

            <div class="loading-line"></div>

        </div>

    </div>


    <!-- =====================================================
         HOME
    ====================================================== -->

    <section class="page active" id="home">

        <div class="content">

            <h1>District</h1>

            <p class="tagline">
                NOTHING STAYS BURIED.
            </p>

            <button class="btn" onclick="showPage('comics')">
                Enter The World
            </button>

        </div>

    </section>


    <!-- =====================================================
         COMICS
    ====================================================== -->

    <section class="page" id="comics">

        <div class="content">

            <h2>Comics</h2>

            <div class="comic-card">

                <h3>Silent Kill</h3>

                <p class="comic-description">
                    A dark story of power, death, and chaos.
                </p>

                <p class="release">
                    CHAPTER 01 · COMING SOON
                </p>

                <button class="btn" onclick="showPage('book')">
                    Read More
                </button>

            </div>

            <div class="navigation">

                <button class="text-button" onclick="showPage('home')">
                    Before
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         SILENT KILL
    ====================================================== -->

    <section class="page" id="book">

        <div class="content">

            <h2>Silent Kill</h2>

            <p class="description">
                ADD YOUR FULL DESCRIPTION HERE
            </p>

            <button class="btn" onclick="showPage('contact')">
                Contact
            </button>

            <div class="navigation">

                <button class="text-button" onclick="showPage('comics')">
                    Before
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         CONTACT
    ====================================================== -->

    <section class="page" id="contact">

        <div class="content">

            <h2>Contact</h2>

            <div class="contact-links">

                <a href="mailto:faloverse@gmail.com">
                    faloverse@gmail.com
                </a>

                <a
                    href="https://instagram.com/faloverse.studio"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>

            </div>

            <div class="navigation">

                <button class="text-button" onclick="showPage('book')">
                    Before
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
